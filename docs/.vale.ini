# Vale prose lint for the docs site. `make docs-vale` downloads styles into
# .vale/styles (gitignored) and lints docs/src/content/docs.
#
# Google is the base. The rules below are off because they misfire on CLI
# reference docs (Title Case headings, flag names, acronyms, parentheses).

StylesPath = .vale/styles
MinAlertLevel = warning
Packages = Google

IgnoredScopes = code, pre
IgnoredClasses = pre, code, span

[*.{md,mdx}]
BasedOnStyles = Vale, Google
Google.Headings = NO
Google.Colons = NO
Google.WordList = NO
Google.Parens = NO
Google.Acronyms = NO
Google.Passive = NO
# This corpus uses spaced dashes, "e.g.", and optional plurals in flag docs.
Google.EmDash = NO
Google.Latin = NO
Google.OptionalPlurals = NO
Google.Units = NO
Google.Spacing = warning
Google.LyHyphens = warning
Vale.Spelling = warning
Vale.Terms = warning
